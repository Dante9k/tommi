name: Windows quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Windows build and verification
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Visual Studio solution
        run: ./scripts/build-solution.ps1
      - name: Build, verify, render and package
        run: ./scripts/build-website.ps1
      - name: Check C# formatting
        run: ./scripts/format-code.ps1 -Check
      - name: Check archive boundaries
        run: ./scripts/check-package.ps1
      - name: Upload installer and portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomato-focus-win-x64
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: |
            build/test-results.txt
            build/render-results.txt
            build/tomato-widget.png
            build/tomato-alarm.png
            build/hanging-storyboard.png
            build/installer-preview.png
            build/installer-results.txt
          if-no-files-found: warn
          retention-days: 7
